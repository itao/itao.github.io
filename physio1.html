<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F4EDD8" id="themeColor" />
    <link rel="icon" href="data:," />
    <title>Daily Physio Exercises</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC&display=swap');

      :root {
        color-scheme: light dark;
        --page: #F4EDD8;
        --surface: #FDFAF2;
        --surface-raised: #FDFAF2;
        --ink: #2E2418;
        --secondary: rgba(46, 36, 24, 0.75);
        --tertiary: rgba(46, 36, 24, 0.50);
        --hairline: rgba(46, 36, 24, 0.08);
        --hairline-strong: rgba(46, 36, 24, 0.15);
        --accent: #4E7A42;
        --accent-ink: #395F31;
        --accent-soft: rgba(78, 122, 66, 0.12);
        --info: #4A7A94;
        --warning: #A86830;
        --warning-soft: rgba(168, 104, 48, 0.10);
        --alert: #8A3838;
        --shadow: 0 18px 46px rgba(46, 36, 24, 0.07);
        --illustration-line: #2E2418;
        --illustration-paper: #FDFAF2;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #1C1810;
          --surface: #252018;
          --surface-raised: #252018;
          --ink: #EDE9D8;
          --secondary: rgba(237, 233, 216, 0.75);
          --tertiary: rgba(237, 233, 216, 0.50);
          --hairline: rgba(237, 233, 216, 0.08);
          --hairline-strong: rgba(237, 233, 216, 0.16);
          --accent: #97B893;
          --accent-ink: #B7D0B3;
          --accent-soft: rgba(151, 184, 147, 0.13);
          --info: #8AACBF;
          --warning: #D29764;
          --warning-soft: rgba(210, 151, 100, 0.12);
          --alert: #D17A75;
          --shadow: 0 18px 52px rgba(0, 0, 0, 0.22);
          --illustration-line: #EDE9D8;
          --illustration-paper: #252018;
        }
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --page: #F4EDD8;
        --surface: #FDFAF2;
        --surface-raised: #FDFAF2;
        --ink: #2E2418;
        --secondary: rgba(46, 36, 24, 0.75);
        --tertiary: rgba(46, 36, 24, 0.50);
        --hairline: rgba(46, 36, 24, 0.08);
        --hairline-strong: rgba(46, 36, 24, 0.15);
        --accent: #4E7A42;
        --accent-ink: #395F31;
        --accent-soft: rgba(78, 122, 66, 0.12);
        --info: #4A7A94;
        --warning: #A86830;
        --warning-soft: rgba(168, 104, 48, 0.10);
        --alert: #8A3838;
        --shadow: 0 18px 46px rgba(46, 36, 24, 0.07);
        --illustration-line: #2E2418;
        --illustration-paper: #FDFAF2;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #1C1810;
        --surface: #252018;
        --surface-raised: #252018;
        --ink: #EDE9D8;
        --secondary: rgba(237, 233, 216, 0.75);
        --tertiary: rgba(237, 233, 216, 0.50);
        --hairline: rgba(237, 233, 216, 0.08);
        --hairline-strong: rgba(237, 233, 216, 0.16);
        --accent: #97B893;
        --accent-ink: #B7D0B3;
        --accent-soft: rgba(151, 184, 147, 0.13);
        --info: #8AACBF;
        --warning: #D29764;
        --warning-soft: rgba(210, 151, 100, 0.12);
        --alert: #D17A75;
        --shadow: 0 18px 52px rgba(0, 0, 0, 0.22);
        --illustration-line: #EDE9D8;
        --illustration-paper: #252018;
      }

      * { box-sizing: border-box; }
      html { min-height: 100%; scroll-behavior: smooth; }

      body {
        min-height: 100%;
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family: "DM Sans", "Noto Sans SC", sans-serif;
        font-size: 16px;
        font-weight: 300;
        line-height: 1.72;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      button { font: inherit; }
      a {
        color: var(--info);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: border-color 0.15s ease;
      }
      a:hover { border-bottom-color: currentColor; }

      .theme-toggle {
        position: fixed;
        z-index: 10;
        top: max(14px, env(safe-area-inset-top));
        right: 14px;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border: 1px solid var(--hairline-strong);
        border-radius: 9999px;
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 7px 22px rgba(46, 36, 24, 0.08);
        cursor: pointer;
        transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .theme-toggle:hover { transform: rotate(8deg); }
      .theme-toggle svg { width: 20px; height: 20px; }
      .theme-toggle .moon { display: block; }
      .theme-toggle .sun { display: none; }
      :root[data-theme="dark"] .theme-toggle .moon { display: none; }
      :root[data-theme="dark"] .theme-toggle .sun { display: block; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) .theme-toggle .moon { display: none; }
        :root:not([data-theme]) .theme-toggle .sun { display: block; }
      }

      .app {
        width: min(100%, 820px);
        min-height: 100svh;
        margin: 0 auto;
        padding: max(22px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
      }

      .progress-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
        padding-right: 48px;
      }

      .step-label {
        margin: 0;
        color: var(--secondary);
        font-size: 0.88rem;
        font-weight: 500;
        letter-spacing: 0.01em;
      }

      .reset-all {
        min-height: 42px;
        padding: 7px 14px;
        border: 1px solid transparent;
        border-radius: 9999px;
        background: transparent;
        color: var(--info);
        font-size: 0.88rem;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s ease, border-color 0.2s ease;
      }
      .reset-all:hover { background: var(--surface); border-color: var(--hairline-strong); }

      .progress-track {
        height: 3px;
        margin-bottom: 20px;
        border-radius: 9999px;
        background: var(--hairline-strong);
        overflow: hidden;
      }
      .progress-fill {
        width: 12.5%;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
        transition: width 0.2s ease;
      }

      .exercise-card {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: clamp(24px, 5vw, 42px);
        border: 1px solid var(--hairline-strong);
        border-radius: 3px 22px 3px 22px;
        background: var(--surface);
        box-shadow: var(--shadow);
        transition: background-color 0.2s ease, border-color 0.2s ease;
      }

      .exercise-number {
        margin: 0 0 7px;
        color: var(--warning);
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 680px;
        margin: 0;
        font-family: "DM Serif Display", "Noto Serif SC", Georgia, serif;
        font-size: 60px;
        font-weight: 400;
        line-height: 1.02;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }

      .dose {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 19px 0 0;
      }
      .dose span {
        display: inline-flex;
        min-height: 32px;
        align-items: center;
        padding: 5px 11px;
        border-radius: 9999px;
        background: var(--accent-soft);
        color: var(--accent-ink);
        font-size: 0.83rem;
        font-weight: 500;
      }

      .illustration {
        width: 100%;
        margin: 24px 0 0;
        overflow: hidden;
        border: 1px solid var(--hairline-strong);
        border-radius: 3px 18px 3px 18px;
        background: #fff;
      }
      .illustration img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 440px;
        object-fit: contain;
        background: #fff;
      }

      .instructions {
        margin: 24px 0 0;
        color: var(--ink);
        font-size: clamp(1.03rem, 3vw, 1.16rem);
        font-weight: 300;
        line-height: 1.72;
      }

      .cue {
        margin: 18px 0 0;
        padding: 13px 15px;
        border-radius: 2px 12px 2px 12px;
        background: var(--warning-soft);
        color: var(--secondary);
        font-size: 0.93rem;
        font-weight: 400;
        line-height: 1.55;
      }
      .cue::before {
        content: "Form cue · ";
        color: var(--warning);
        font-weight: 500;
      }

      .controls { margin-top: auto; padding-top: 30px; }
      .control-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
      .control-panel {
        padding: 17px;
        border: 1px solid var(--hairline-strong);
        border-radius: 14px 3px 14px 3px;
        background: var(--surface-raised);
      }
      .control-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }
      .control-title h2 {
        margin: 0;
        font-family: "DM Serif Display", "Noto Serif SC", Georgia, serif;
        font-size: 1.02rem;
        font-weight: 400;
        letter-spacing: 0;
      }
      .set-status { color: var(--tertiary); font-size: 0.8rem; font-weight: 500; }

      .counter-row,
      .timer-row {
        display: grid;
        grid-template-columns: 56px 1fr 56px;
        gap: 10px;
        align-items: stretch;
      }
      .round-button,
      .timer-button,
      .next-set-button,
      .nav-button {
        min-height: 56px;
        border-radius: 9999px;
        font-weight: 500;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      }
      .round-button {
        border: 1px solid var(--hairline-strong);
        background: var(--surface);
        color: var(--ink);
        font-size: 1.45rem;
      }
      .round-button:hover:not(:disabled), .nav-button:hover:not(:disabled) { border-color: var(--accent); }
      .round-button:active, .nav-button:active, .timer-button:active, .next-set-button:active { transform: translateY(1px); }
      .round-button:disabled, .nav-button:disabled { cursor: default; opacity: 0.34; }

      .count-readout,
      .timer-readout {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 7px;
        border-radius: 9999px;
        background: var(--accent-soft);
        color: var(--accent-ink);
        font-variant-numeric: tabular-nums;
      }
      .count-current, .timer-current { font-size: 2rem; font-weight: 500; line-height: 1; }
      .count-target, .timer-unit { font-size: 0.87rem; font-weight: 500; }
      .timer-row { grid-template-columns: 1fr 1.2fr; }
      .timer-readout { min-height: 56px; }
      .timer-button, .next-set-button {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--surface);
      }
      .timer-button:hover:not(:disabled), .next-set-button:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
      .timer-button:disabled { cursor: default; opacity: 0.45; }
      .next-set-button { width: 100%; margin-top: 10px; }
      .timer-note { margin: 9px 0 0; color: var(--tertiary); font-size: 0.78rem; line-height: 1.45; }
      .done-note { display: none; margin: 12px 0 0; color: var(--accent-ink); font-weight: 500; text-align: center; }
      .done-note.is-visible { display: block; }

      .navigation {
        display: grid;
        grid-template-columns: 1fr 1.45fr;
        gap: 10px;
        padding-top: 14px;
      }
      .nav-button {
        border: 1px solid var(--hairline-strong);
        background: var(--surface);
        color: var(--ink);
      }
      .nav-button.primary { border-color: var(--accent); background: var(--accent); color: var(--surface); }
      .nav-button.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }

      button:focus-visible { outline: 3px solid var(--warning); outline-offset: 3px; }

      @media (max-width: 639px) {
        .app { padding-inline: 12px; }
        h1 { font-size: clamp(28px, 10vw, 45px); }
        .exercise-card { padding: 22px 18px 24px; }
        .illustration { margin-inline: -18px; width: calc(100% + 36px); }
        .navigation { grid-template-columns: 1fr 1.35fr; }
        .theme-toggle { right: 10px; }
      }
      @media (min-width: 640px) {
        .app { padding-inline: 24px; }
        .control-grid.has-timer { grid-template-columns: 1fr 1fr; }
        .navigation { grid-template-columns: 1fr 1fr; }
      }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8.7 8.7 0 0 1 8.8 4a8.7 8.7 0 1 0 11.2 11.2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>

    <main class="app" aria-live="polite">
      <div class="progress-head">
        <p class="step-label" id="stepLabel">Exercise 1 of 8</p>

      <div class="progress-track" role="progressbar" aria-label="Exercise progress" aria-valuemin="1" aria-valuemax="8" aria-valuenow="1">
        <div class="progress-fill" id="progressFill"></div>
      </div>

            instruction: 'Sit with your knee stacked above your ankle and keep the ball of your foot and heel on the floor. First, lift the big toe while the little toes stay planted. Then lift the little toes while the big toe stays planted.',
            cue: 'Move slowly and keep the resting toes grounded.',
            photoAlt: 'Foot alternating between lifting the big toe and the smaller toes'
          }
        ];

        var states = exercises.map(function (exercise) {
          return { reps: 0, set: 1, complete: false, timer: exercise.hold, running: false };
        });
        var currentIndex = 0;
        var timerId = null;

        var el = {
          themeToggle: document.getElementById('themeToggle'),
          themeColor: document.getElementById('themeColor'),
          stepLabel: document.getElementById('stepLabel'),
          progressTrack: document.querySelector('.progress-track'),
          progressFill: document.getElementById('progressFill'),
          exerciseNumber: document.getElementById('exerciseNumber'),
          exerciseTitle: document.getElementById('exerciseTitle'),
          dose: document.getElementById('dose'),
          exercisePhoto: document.getElementById('exercisePhoto'),
          instructions: document.getElementById('instructions'),
          cue: document.getElementById('cue'),
          controlGrid: document.getElementById('controlGrid'),
          setStatus: document.getElementById('setStatus'),
          repCurrent: document.getElementById('repCurrent'),
          repTarget: document.getElementById('repTarget'),
          repMinus: document.getElementById('repMinus'),
          repPlus: document.getElementById('repPlus'),
          nextSet: document.getElementById('nextSet'),
          doneNote: document.getElementById('doneNote'),
          timerPanel: document.getElementById('timerPanel'),
          holdStatus: document.getElementById('holdStatus'),
          timerCurrent: document.getElementById('timerCurrent'),
          timerButton: document.getElementById('timerButton'),
          prevButton: document.getElementById('prevButton'),
          nextButton: document.getElementById('nextButton'),
          resetAll: document.getElementById('resetAll')
        };

        function systemPrefersDark() {
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        function currentThemeIsDark() {
          var explicit = document.documentElement.getAttribute('data-theme');
          return explicit ? explicit === 'dark' : systemPrefersDark();
        }

        function updateThemeControl() {
          var dark = currentThemeIsDark();
          el.themeToggle.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
          el.themeToggle.setAttribute('aria-pressed', dark ? 'true' : 'false');
          el.themeColor.setAttribute('content', dark ? '#1C1810' : '#F4EDD8');
        }

        el.themeToggle.addEventListener('click', function () {
          document.documentElement.setAttribute('data-theme', currentThemeIsDark() ? 'light' : 'dark');
          updateThemeControl();
        });

        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
            if (!document.documentElement.hasAttribute('data-theme')) updateThemeControl();
          });
        }
        updateThemeControl();

        function stopTimer(resetCurrent) {
          if (timerId !== null) {
            window.clearInterval(timerId);
            timerId = null;
          }
          var state = states[currentIndex];
          state.running = false;
          if (resetCurrent) state.timer = exercises[currentIndex].hold;
        }

        function addRep() {
          var exercise = exercises[currentIndex];
          var state = states[currentIndex];
          if (state.complete || state.reps >= exercise.reps) return;
          state.reps += 1;
          if (state.reps === exercise.reps && state.set === exercise.sets) state.complete = true;
          renderControls();
        }

        function renderDose(exercise) {
          var parts = [exercise.reps + ' reps'];
          if (exercise.hold) parts.push('hold ' + exercise.hold + ' sec');
          parts.push(exercise.sets + (exercise.sets === 1 ? ' set' : ' sets'));
          parts.push('1× daily');
          el.dose.innerHTML = '';
          parts.forEach(function (part) {
            var chip = document.createElement('span');
            chip.textContent = part;
            el.dose.appendChild(chip);
          });
        }

        function renderControls() {
          var exercise = exercises[currentIndex];
          var state = states[currentIndex];
          var setFinished = state.reps >= exercise.reps;
          el.setStatus.textContent = 'Set ' + state.set + ' of ' + exercise.sets;
          el.repCurrent.textContent = String(state.reps);
          el.repTarget.textContent = '/ ' + exercise.reps;
          el.repMinus.disabled = state.reps === 0 || state.running;
          el.repPlus.disabled = setFinished || state.running;
          el.nextSet.hidden = !(setFinished && state.set < exercise.sets);
          el.doneNote.classList.toggle('is-visible', state.complete);

          if (exercise.hold) {
            el.timerPanel.hidden = false;
            el.controlGrid.classList.add('has-timer');
            el.holdStatus.textContent = exercise.hold + (exercise.hold === 1 ? ' second' : ' seconds');
            el.timerCurrent.textContent = String(state.timer);
            el.timerButton.textContent = state.running ? 'Pause' : (state.timer < exercise.hold ? 'Resume' : 'Start hold');
            el.timerButton.disabled = setFinished;
          } else {
            el.timerPanel.hidden = true;
            el.controlGrid.classList.remove('has-timer');
          }
        }

        function render() {
          stopTimer(false);
          var exercise = exercises[currentIndex];
          var number = currentIndex + 1;
          el.stepLabel.textContent = 'Exercise ' + number + ' of ' + exercises.length;
          el.exerciseNumber.textContent = 'Exercise ' + String(number).padStart(2, '0');
          el.exerciseTitle.textContent = exercise.title;
          el.instructions.textContent = exercise.instruction;
          el.cue.textContent = exercise.cue;
          el.exercisePhoto.src = exercise.photo;
          el.exercisePhoto.alt = exercise.photoAlt;
          renderDose(exercise);
          renderControls();
          var progress = (number / exercises.length) * 100;
          el.progressFill.style.width = progress + '%';
          el.progressTrack.setAttribute('aria-valuenow', String(number));
          el.prevButton.disabled = currentIndex === 0;
          el.nextButton.textContent = currentIndex === exercises.length - 1 ? 'Back to first' : 'Next exercise';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        el.repPlus.addEventListener('click', addRep);
        el.repMinus.addEventListener('click', function () {
          var state = states[currentIndex];
          if (state.reps > 0) state.reps -= 1;
          state.complete = false;
          renderControls();
        });
        el.nextSet.addEventListener('click', function () {
          var exercise = exercises[currentIndex];
          var state = states[currentIndex];
          if (state.set < exercise.sets && state.reps >= exercise.reps) {
            state.set += 1;
            state.reps = 0;
            state.timer = exercise.hold;
            renderControls();
          }
        });
        el.timerButton.addEventListener('click', function () {
          var exercise = exercises[currentIndex];
          var state = states[currentIndex];
          if (state.running) {
            stopTimer(false);
            renderControls();
            return;
          }
          if (state.timer <= 0) state.timer = exercise.hold;
          state.running = true;
          renderControls();
          timerId = window.setInterval(function () {
            state.timer -= 1;
            if (state.timer <= 0) {
              stopTimer(false);
              state.timer = exercise.hold;
              addRep();
            } else {
              renderControls();
            }
          }, 1000);
        });
        el.prevButton.addEventListener('click', function () {
          if (currentIndex > 0) {
            stopTimer(true);
            currentIndex -= 1;
            render();
          }
        });
        el.nextButton.addEventListener('click', function () {
          stopTimer(true);
          currentIndex = currentIndex === exercises.length - 1 ? 0 : currentIndex + 1;
          render();
        });
        el.resetAll.addEventListener('click', function () {
          stopTimer(true);
          states = exercises.map(function (exercise) {
            return { reps: 0, set: 1, complete: false, timer: exercise.hold, running: false };
          });
          currentIndex = 0;
          render();
        });

        render();
      }());
    </script>
